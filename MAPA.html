<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Noche UY — Mapa de jodas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0A0A;
    --panel: #141414;
    --panel-2: #1C1C1C;
    --line: #2B2B2B;
    --text: #FFFFFF;
    --muted: #9C9C9C;
    --yellow: #FFD400;
    --pink: #E4267A;
    --orange: #FF7A1A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    overflow:hidden;
  }
  #map{ position:absolute; inset:0; z-index:1; }

  /* ---------- Top bar ---------- */
  .topbar{
    position:absolute; top:0; left:0; right:0; z-index:500;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px;
    background:linear-gradient(180deg, rgba(10,10,10,0.95) 10%, rgba(10,10,10,0));
    pointer-events:none;
  }
  .brand{ display:flex; align-items:center; gap:12px; pointer-events:auto;}
  .brand-badge{
    width:46px; height:46px; border-radius:50%;
    background: conic-gradient(from 200deg, var(--pink), var(--orange), var(--yellow), var(--pink));
    padding:2.5px;
    flex-shrink:0;
    position:relative;
  }
  .brand-badge-inner{
    width:100%; height:100%; border-radius:50%;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .brand-badge-inner span{
    font-family:'Bebas Neue', sans-serif; font-size:19px; letter-spacing:0.5px; color:#fff;
  }
  .brand-badge-inner small{
    position:absolute; top:6px; right:6px;
    font-size:6px; font-weight:700; color:var(--yellow); letter-spacing:0.5px;
  }
  .brand-text h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:24px; letter-spacing:1.5px;
    color:var(--text);
    line-height:1;
  }
  .brand-text small{ color:var(--muted); font-size:11px; letter-spacing:1px; text-transform:uppercase;}

  .topbar-actions{ display:flex; gap:10px; pointer-events:auto; }
  .btn-add, .btn-share{
    border:none;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:14px;
    padding:12px 18px;
    border-radius:999px;
    cursor:pointer;
    letter-spacing:0.3px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-add{
    background:var(--yellow);
    color:#000;
    box-shadow:0 6px 20px rgba(255,212,0,0.3);
  }
  .btn-add:hover{ transform:translateY(-1px); box-shadow:0 8px 24px rgba(255,212,0,0.45); }
  .btn-add.placing{ background:var(--pink); color:#fff; box-shadow:0 6px 20px rgba(228,38,122,0.4); }
  .btn-share{
    background:transparent;
    color:var(--text);
    border:1px solid var(--line);
    display:flex; align-items:center; gap:6px;
  }
  .btn-share:hover{ border-color:var(--yellow); color:var(--yellow); }
  .btn-add:focus-visible, .btn-share:focus-visible{ outline:2px solid var(--pink); outline-offset:2px; }

  /* ---------- Hint banner while placing pin ---------- */
  .hint{
    position:absolute; top:88px; left:50%; transform:translateX(-50%);
    z-index:600;
    background:var(--yellow); color:#1a1400;
    font-weight:700; font-size:13px;
    padding:10px 18px; border-radius:999px;
    display:none;
    box-shadow:0 6px 20px rgba(0,0,0,0.5);
  }
  .hint.show{ display:block; }

  /* ---------- Toast ---------- */
  .toast{
    position:absolute; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    z-index:1000;
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    padding:12px 20px; border-radius:999px; font-size:13px; font-weight:600;
    opacity:0; pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Sidebar list ---------- */
  .sidebar{
    position:absolute; top:0; right:0; bottom:0; z-index:400;
    width:340px; max-width:88vw;
    background:var(--panel);
    border-left:1px solid var(--line);
    display:flex; flex-direction:column;
    transform:translateX(0);
    transition: transform .25s ease;
  }
  .sidebar.collapsed{ transform:translateX(100%); }
  .sidebar-header{
    padding:78px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  .sidebar-header h2{
    font-family:'Bebas Neue', sans-serif;
    font-size:22px; letter-spacing:1px; color:var(--text); margin-bottom:10px;
  }
  .filters{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    font-size:11px; padding:6px 10px; border-radius:999px;
    border:1px solid var(--line); background:transparent; color:var(--muted);
    cursor:pointer; font-family:'Space Grotesk', sans-serif; font-weight:600;
  }
  .chip.active{ background:var(--pink); border-color:var(--pink); color:#fff; }
  .chip:focus-visible{ outline:2px solid var(--yellow); outline-offset:2px; }

  .event-list{ flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
  .event-list::-webkit-scrollbar{ width:6px; }
  .event-list::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }

  .ticket{
    position:relative;
    background:var(--panel-2);
    border-radius:10px;
    padding:14px 14px 14px 16px;
    border:1px dashed var(--line);
    transition: border-color .15s ease, background .15s ease;
  }
  .ticket:hover{ border-color: var(--cat-color, var(--pink)); background:#242424; }
  .ticket:before, .ticket:after{
    content:''; position:absolute; width:12px; height:12px; border-radius:50%;
    background:var(--bg); top:50%; transform:translateY(-50%);
  }
  .ticket:before{ left:-6px; }
  .ticket:after{ right:-6px; }
  .ticket .cat-dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--cat-color, var(--pink)); margin-right:6px;
  }
  .ticket .cat-label{ font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .ticket h3{ font-size:16px; margin:6px 0 4px; color:var(--text); cursor:pointer; }
  .ticket .meta{ font-size:12px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; cursor:pointer; }
  .ticket .desc{ font-size:12px; color:var(--muted); margin-top:6px; line-height:1.4; cursor:pointer; }
  .ticket-actions{ display:flex; gap:8px; margin-top:10px; }
  .mini-btn{
    font-size:11px; font-weight:700; padding:6px 10px; border-radius:999px;
    border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer;
  }
  .mini-btn:hover{ color:var(--text); border-color:var(--muted); }
  .mini-btn.danger:hover{ color:#fff; border-color:var(--pink); background:var(--pink); }
  .owner-tag{ font-size:10px; color:var(--yellow); font-weight:700; margin-left:6px; }

  .empty-state{
    margin:auto; text-align:center; padding:30px 20px; color:var(--muted); font-size:13px; line-height:1.6;
  }

  .toggle-sidebar{
    position:absolute; top:80px; right:340px; z-index:401;
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    width:32px; height:32px; border-radius:8px 0 0 8px;
    cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center;
    transition: right .25s ease;
  }
  .sidebar.collapsed ~ .toggle-sidebar{ right:0; }

  /* ---------- Modal ---------- */
  .overlay{
    position:absolute; inset:0; z-index:900;
    background:rgba(0,0,0,0.75);
    display:none; align-items:center; justify-content:center;
    padding:20px;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    width:100%; max-width:420px; padding:24px; max-height:90vh; overflow-y:auto;
  }
  .modal h2{ font-family:'Bebas Neue', sans-serif; font-size:26px; letter-spacing:1px; margin-bottom:4px; }
  .modal .sub{ font-size:12px; color:var(--muted); margin-bottom:18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color:var(--muted); margin-bottom:6px; }
  .field input, .field textarea, .field select{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:8px; font-family:'Space Grotesk', sans-serif; font-size:14px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:2px solid var(--pink); outline-offset:1px; border-color:var(--pink); }
  .field textarea{ resize:vertical; min-height:60px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .coord-note{ font-size:11px; color:var(--yellow); margin-bottom:14px; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn-primary, .btn-secondary{
    flex:1; padding:12px; border-radius:8px; border:none; font-weight:700; cursor:pointer; font-family:'Space Grotesk', sans-serif;
  }
  .btn-primary{ background:var(--yellow); color:#000; }
  .btn-secondary{ background:transparent; color:var(--muted); border:1px solid var(--line); }
  .btn-primary:focus-visible, .btn-secondary:focus-visible{ outline:2px solid var(--pink); outline-offset:2px; }

  /* ---------- Marker ---------- */
  .joda-pin{
    width:30px; height:38px;
    display:flex; align-items:center; justify-content:center;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6));
  }
  .joda-pin svg{ width:100%; height:100%; }

  .leaflet-popup-content-wrapper{
    background:var(--panel-2); color:var(--text); border-radius:12px;
  }
  .leaflet-popup-tip{ background:var(--panel-2); }
  .popup-card .cat-label{ font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .popup-card h3{ font-family:'Bebas Neue', sans-serif; font-size:20px; letter-spacing:0.5px; margin:4px 0; }
  .popup-card .meta{ font-size:12px; color:var(--muted); margin-bottom:6px; }
  .popup-card .desc{ font-size:12px; line-height:1.4; }
  .popup-card .popup-actions{ display:flex; gap:8px; margin-top:10px; }

  @media (max-width:640px){
    .sidebar{ width:100vw; max-width:100vw; }
    .toggle-sidebar{ right:0; }
    .sidebar.collapsed ~ .toggle-sidebar{ right:0; }
    .brand-text h1{ font-size:19px; }
    .btn-share span.label{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="topbar">
  <div class="brand">
    <div class="brand-badge"><div class="brand-badge-inner"><span>LN</span><small>UY</small></div></div>
    <div class="brand-text">
      <h1>LA NOCHE UY</h1>
      <small>mapa de jodas</small>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="btn-share" id="btnShareApp">🔗 <span class="label">Compartir</span></button>
    <button class="btn-add" id="btnAdd">+ Agregar joda</button>
  </div>
</div>

<div class="hint" id="hint">Tocá el mapa donde es la joda 📍</div>
<div class="toast" id="toast"></div>

<button class="toggle-sidebar" id="toggleSidebar">›</button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>Jodas cerca tuyo</h2>
    <div class="filters" id="filters"></div>
  </div>
  <div class="event-list" id="eventList"></div>
</aside>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Nueva joda</h2>
    <div class="coord-note" id="coordText">Ubicación marcada en el mapa ✓</div>
    <form id="eventForm">
      <div class="field">
        <label for="title">Nombre de la joda</label>
        <input id="title" required maxlength="60" placeholder="Ej: Previa en lo de Rodri">
      </div>
      <div class="row2">
        <div class="field">
          <label for="date">Fecha</label>
          <input id="date" type="date" required>
        </div>
        <div class="field">
          <label for="time">Hora</label>
          <input id="time" type="time" required>
        </div>
      </div>
      <div class="field">
        <label for="place">Lugar / referencia (opcional)</label>
        <input id="place" maxlength="80" placeholder="Ej: Rambla y 21, o el nombre del boliche">
      </div>
      <div class="field">
        <label for="category">Categoría</label>
        <select id="category">
          <option value="fiesta">Fiesta electrónica</option>
          <option value="recital">Recital / banda</option>
          <option value="boliche">Boliche</option>
          <option value="cumple">Cumpleaños</option>
          <option value="otro">Otro</option>
        </select>
      </div>
      <div class="field">
        <label for="desc">Info para los invitados</label>
        <textarea id="desc" maxlength="240" placeholder="Vestimenta, entrada, con quién hablar, etc."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="btnCancel">Cancelar</button>
        <button type="submit" class="btn-primary">Publicar joda</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  const CATS = {
    fiesta:  { label:'Fiesta electrónica', color:'#E4267A' },
    recital: { label:'Recital / banda',    color:'#FF7A1A' },
    boliche: { label:'Boliche',            color:'#FFD400' },
    cumple:  { label:'Cumpleaños',         color:'#2ECC71' },
    otro:    { label:'Otro',               color:'#9C9C9C' },
  };
  const STORAGE_KEY = 'jodas-events';
  const OWNER_KEY = 'la-noche-uy-owner-id';

  const map = L.map('map', { zoomControl:false, attributionControl:false }).setView([-34.9011, -56.1645], 12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 20
  }).addTo(map);
  L.control.zoom({ position:'bottomleft' }).addTo(map);

  let events = [];
  let markers = {};
  let activeFilter = 'all';
  let placing = false;
  let pendingCoords = null;
  let myOwnerId = null;

  function pinIcon(color){
    return L.divIcon({
      className:'joda-pin',
      html:`<svg viewBox="0 0 30 38" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 0C6.7 0 0 6.7 0 15c0 10.5 15 23 15 23s15-12.5 15-23C30 6.7 23.3 0 15 0z" fill="${color}"/>
              <circle cx="15" cy="14" r="6" fill="#0A0A0A"/>
            </svg>`,
      iconSize:[30,38],
      iconAnchor:[15,36],
      popupAnchor:[0,-32],
    });
  }

  function fmtDate(dateStr, timeStr){
    try{
      const d = new Date(dateStr + 'T' + (timeStr || '00:00'));
      const opts = { weekday:'short', day:'numeric', month:'short' };
      return d.toLocaleDateString('es-UY', opts) + ' · ' + (timeStr || '');
    }catch(e){ return dateStr; }
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  let toastTimer = null;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
  }

  // ---- Owner identity (personal, private per user) ----
  async function getOwnerId(){
    try{
      const res = await window.storage.get(OWNER_KEY, false);
      if(res && res.value) return res.value;
    }catch(e){ /* not found yet */ }
    const id = 'own_' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '_' + Math.random().toString(36).slice(2));
    try{ await window.storage.set(OWNER_KEY, id, false); }catch(e){}
    return id;
  }

  // ---- Share helpers ----
  function shareOrCopy(shareData, copyText, successMsg){
    if(navigator.share){
      navigator.share(shareData).catch(()=>{});
      return;
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(copyText).then(()=> showToast(successMsg)).catch(()=> showToast('No pudimos copiar el link'));
    }else{
      showToast(copyText);
    }
  }

  function appUrl(){ return window.location.href.split('#')[0]; }

  function eventUrl(ev){ return appUrl() + '#ev=' + encodeURIComponent(ev.id); }

  function shareApp(){
    shareOrCopy(
      { title:'La Noche UY', text:'Mirá el mapa de jodas de La Noche UY', url: appUrl() },
      appUrl(),
      'Link copiado ✅ Compartilo para que la gente solo pueda ver.'
    );
  }

  function shareEvent(ev){
    const text = `${ev.title} · ${fmtDate(ev.date, ev.time)}${ev.place ? ' · ' + ev.place : ''} — vía La Noche UY`;
    shareOrCopy(
      { title: ev.title, text, url: eventUrl(ev) },
      `${text}\n${eventUrl(ev)}`,
      'Link de la joda copiado ✅'
    );
  }

  function renderFilters(){
    const el = document.getElementById('filters');
    const all = document.createElement('button');
    all.className = 'chip' + (activeFilter==='all' ? ' active':'');
    all.textContent = 'Todas';
    all.onclick = () => { activeFilter='all'; renderFilters(); renderList(); };
    el.innerHTML = '';
    el.appendChild(all);
    Object.entries(CATS).forEach(([key,val])=>{
      const b = document.createElement('button');
      b.className = 'chip' + (activeFilter===key ? ' active':'');
      b.textContent = val.label;
      b.onclick = () => { activeFilter = key; renderFilters(); renderList(); };
      el.appendChild(b);
    });
  }

  function renderMarkers(){
    Object.values(markers).forEach(m => map.removeLayer(m));
    markers = {};
    events.forEach(ev => {
      const color = (CATS[ev.category] || CATS.otro).color;
      const marker = L.marker([ev.lat, ev.lng], { icon: pinIcon(color) }).addTo(map);
      marker.bindPopup(popupHtml(ev));
      marker.on('popupopen', () => bindPopupActions(ev));
      markers[ev.id] = marker;
    });
  }

  function popupHtml(ev){
    const cat = CATS[ev.category] || CATS.otro;
    const isOwner = ev.ownerId === myOwnerId;
    return `<div class="popup-card" data-ev="${ev.id}">
      <div class="cat-label">${cat.label}${isOwner ? ' · vos la creaste' : ''}</div>
      <h3>${escapeHtml(ev.title)}</h3>
      <div class="meta">${ev.place ? escapeHtml(ev.place) + ' · ' : ''}${fmtDate(ev.date, ev.time)}</div>
      ${ev.desc ? `<div class="desc">${escapeHtml(ev.desc)}</div>` : ''}
      <div class="popup-actions">
        <button class="mini-btn" data-action="share">🔗 Compartir</button>
        ${isOwner ? `<button class="mini-btn danger" data-action="delete">Eliminar</button>` : ''}
      </div>
    </div>`;
  }

  function bindPopupActions(ev){
    const wrap = document.querySelector(`.popup-card[data-ev="${CSS.escape(ev.id)}"]`);
    if(!wrap) return;
    const shareBtn = wrap.querySelector('[data-action="share"]');
    if(shareBtn) shareBtn.onclick = () => shareEvent(ev);
    const delBtn = wrap.querySelector('[data-action="delete"]');
    if(delBtn) delBtn.onclick = () => deleteEvent(ev.id);
  }

  async function deleteEvent(id){
    if(!confirm('¿Eliminar esta joda? Esta acción no se puede deshacer.')) return;
    events = events.filter(ev => ev.id !== id);
    await saveEvents();
    renderMarkers();
    renderList();
    showToast('Joda eliminada');
  }

  function renderList(){
    const list = document.getElementById('eventList');
    list.innerHTML = '';
    const filtered = events
      .filter(ev => activeFilter==='all' || ev.category===activeFilter)
      .sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));

    if(filtered.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = events.length === 0
        ? 'Todavía no hay jodas cargadas. ¡Tocá el mapa para agregar la primera!'
        : 'No hay jodas en esta categoría por ahora.';
      list.appendChild(empty);
      return;
    }

    filtered.forEach(ev => {
      const cat = CATS[ev.category] || CATS.otro;
      const isOwner = ev.ownerId === myOwnerId;
      const card = document.createElement('div');
      card.className = 'ticket';
      card.style.setProperty('--cat-color', cat.color);
      card.innerHTML = `
        <span class="cat-dot"></span><span class="cat-label">${cat.label}</span>${isOwner ? '<span class="owner-tag">TUYA</span>' : ''}
        <h3 data-role="focus">${escapeHtml(ev.title)}</h3>
        <div class="meta" data-role="focus"><span>${ev.place ? '📍 ' + escapeHtml(ev.place) : '📍 en el mapa'}</span><span>🗓 ${fmtDate(ev.date, ev.time)}</span></div>
        ${ev.desc ? `<div class="desc" data-role="focus">${escapeHtml(ev.desc)}</div>` : ''}
        <div class="ticket-actions">
          <button class="mini-btn" data-action="share">🔗 Compartir</button>
          ${isOwner ? `<button class="mini-btn danger" data-action="delete">Eliminar</button>` : ''}
        </div>
      `;
      card.querySelectorAll('[data-role="focus"]').forEach(node => {
        node.onclick = () => {
          map.flyTo([ev.lat, ev.lng], 15, { duration:0.6 });
          const m = markers[ev.id];
          if(m) setTimeout(()=> m.openPopup(), 500);
        };
      });
      const shareBtn = card.querySelector('[data-action="share"]');
      if(shareBtn) shareBtn.onclick = () => shareEvent(ev);
      const delBtn = card.querySelector('[data-action="delete"]');
      if(delBtn) delBtn.onclick = () => deleteEvent(ev.id);
      list.appendChild(card);
    });
  }

  async function loadEvents(){
    try{
      const res = await window.storage.get(STORAGE_KEY, true);
      events = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      events = [];
    }
    renderMarkers();
    renderList();
    focusFromHash();
  }

  function focusFromHash(){
    const match = window.location.hash.match(/ev=([^&]+)/);
    if(!match) return;
    const id = decodeURIComponent(match[1]);
    const ev = events.find(e => e.id === id);
    if(!ev) return;
    map.setView([ev.lat, ev.lng], 16);
    const m = markers[ev.id];
    if(m) setTimeout(()=> m.openPopup(), 400);
  }

  async function saveEvents(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(events), true);
    }catch(e){
      console.error('No se pudo guardar', e);
    }
  }

  // ---- Add flow: tap map to create ----
  const btnAdd = document.getElementById('btnAdd');
  const hint = document.getElementById('hint');
  const overlay = document.getElementById('overlay');
  const form = document.getElementById('eventForm');

  btnAdd.onclick = () => {
    placing = true;
    hint.classList.add('show');
    btnAdd.classList.add('placing');
    btnAdd.textContent = 'Tocá el mapa...';
  };

  function stopPlacing(){
    placing = false;
    hint.classList.remove('show');
    btnAdd.classList.remove('placing');
    btnAdd.textContent = '+ Agregar joda';
  }

  map.on('click', (e) => {
    if(!placing) return;
    pendingCoords = e.latlng;
    stopPlacing();
    overlay.classList.add('show');
  });

  document.getElementById('btnCancel').onclick = () => {
    overlay.classList.remove('show');
    form.reset();
    pendingCoords = null;
  };

  document.getElementById('btnShareApp').onclick = shareApp;

  form.onsubmit = async (e) => {
    e.preventDefault();
    if(!pendingCoords) return;
    const newEvent = {
      id: 'ev_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      title: document.getElementById('title').value.trim(),
      date: document.getElementById('date').value,
      time: document.getElementById('time').value,
      place: document.getElementById('place').value.trim(),
      category: document.getElementById('category').value,
      desc: document.getElementById('desc').value.trim(),
      lat: pendingCoords.lat,
      lng: pendingCoords.lng,
      createdAt: Date.now(),
      ownerId: myOwnerId,
    };
    events.push(newEvent);
    await saveEvents();
    renderMarkers();
    renderList();
    overlay.classList.remove('show');
    form.reset();
    pendingCoords = null;
    map.flyTo([newEvent.lat, newEvent.lng], 15, { duration:0.6 });
    showToast('Joda publicada 🎉');
  };

  // ---- Sidebar toggle ----
  const sidebar = document.getElementById('sidebar');
  const toggleBtn = document.getElementById('toggleSidebar');
  toggleBtn.onclick = () => {
    sidebar.classList.toggle('collapsed');
    toggleBtn.textContent = sidebar.classList.contains('collapsed') ? '‹' : '›';
  };

  renderFilters();
  getOwnerId().then(id => {
    myOwnerId = id;
    loadEvents();
  });
})();
</script>
</body>
</html>
