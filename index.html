<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>San Valentín</title>
    <style>
        body {
            background-color: pink;
            color: black;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            margin-top: 40px;
        }

        img {
            width: 250px;
        }

        .texto {
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            font-size: 20px;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }

        #si {
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExZWR5Zzl1MjF2d2dldXpjdnZwdno0ZmV2Ym9rN2M1Nm9ibWI3cWJhbCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/1ViLp0GBYhTcA/giphy.gif" alt="gif">

        <div class="texto" id="texto">
            Prometo risas, cariño y algún que otro mimo. <br>

            ¿Aceptás ser mi San Valentín? ❤️
        </div>

        <div class="buttons">
            <button id="si">Sí</button>
            <button id="no">No</button>
        </div>
    </div>

    <script>
        let escala = 1;

        document.getElementById("no").addEventListener("click", () => {
            escala += 0.2;
            document.getElementById("si").style.transform = `scale(${escala})`;
        });

        document.getElementById("si").addEventListener("click", () => {
            document.getElementById("texto").innerText =
                "Sabía que ibas a decir que sí 💘";
        });
    </script>

</body>
</html>
